    <script>
      // Basic global polyfill
      window.global = window;

      // Robust Emscripten / MediaPipe dataFileDownloads proxy protector
      (function() {
        var safeDownloads = {};
        var safeProxy = new Proxy(safeDownloads, {
          get: function(target, prop) {
            if (!(prop in target) && typeof prop === 'string') {
              target[prop] = { loaded: 0, total: 1 };
            }
            return target[prop];
          },
          set: function(target, prop, value) {
            target[prop] = value;
            return true;
          }
        });

        // Initialize Module and createMediapipeSolutionsPackedAssets with the proxy
        window.Module = window.Module || {};
        window.Module.dataFileDownloads = safeProxy;

        window.createMediapipeSolutionsPackedAssets = window.createMediapipeSolutionsPackedAssets || {};
        window.createMediapipeSolutionsPackedAssets.dataFileDownloads = safeProxy;

        // Catch both global errors and unhandled rejections
        var suppressPattern = /face_mesh_solution_packed_assets|@mediapipe\/face_mesh/;
        
        var originalOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          var text = (msg || '') + ' ' + ((error && error.message) || '');
          if (suppressPattern.test(text)) {
            console.warn('Suppressed MediaPipe asset load warning:', text);
            return true;
          }
          if (typeof originalOnError === 'function') {
            return originalOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (suppressPattern.test(msg)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            console.warn('Suppressed external MediaPipe asset loading error:', msg);
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) || '';
          var msg = (typeof reason === 'object' ? reason.message : String(reason)) || '';
          if (suppressPattern.test(msg)) {
            if (e.preventDefault) e.preventDefault();
            console.warn('Suppressed unhandled MediaPipe rejection:', msg);
          }
        });
      })();
    </script>
